name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12"]

    # A throwaway PostgreSQL for the tool tests. The tools under seniocare/tools/
    # open a real connection on every call, so there are no DB-free "unit" tests
    # today; the schema + seed data are created by seniocare.data.database.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: seniocare
          POSTGRES_PASSWORD: seniocare
          POSTGRES_DB: seniocare_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U seniocare"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://seniocare:seniocare@localhost:5432/seniocare_test
      APP_DATABASE_URL: postgresql://seniocare:seniocare@localhost:5432/seniocare_test
      PYTHONIOENCODING: utf-8

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Byte-compile everything
        run: python -m compileall -q seniocare app main.py evals

      - name: Eval cases load and validate
        run: python evals/runner.py --dry-run

      - name: Tests
        run: python -m pytest tests -q --timeout=120

  lint:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refuse committed secrets
        # The SerpAPI key that used to live in web_search.py must never come back.
        run: |
          if grep -rInE "SERPAPI_KEY\s*=\s*['\"][0-9a-f]{32,}" --include=*.py . ; then
            echo "::error::Hardcoded SerpAPI key found"; exit 1; fi
          if git ls-files | grep -E "^\.env$|\.json$" | xargs -r grep -lE "\"private_key\"" ; then
            echo "::error::Firebase service-account JSON is tracked"; exit 1; fi
      - name: Refuse tracked scratch files
        run: |
          if git ls-files | grep -E "^\.gemini_scratch/|^Gemma4_ADK_Server" ; then
            echo "::error::Scratch files are tracked"; exit 1; fi
